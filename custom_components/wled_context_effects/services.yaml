# Services for WLED Context Effects integration

start_effect:
  name: Start Effect
  description: Start a configured effect
  target:
    entity:
      integration: wled_context_effects
      domain: switch

stop_effect:
  name: Stop Effect
  description: Stop a running effect
  target:
    entity:
      integration: wled_context_effects
      domain: switch

run_once:
  name: Run Once
  description: Run effect once (single iteration)
  target:
    entity:
      integration: wled_context_effects
      domain: switch

set_config:
  name: Set Configuration
  description: Update effect configuration dynamically
  target:
    entity:
      integration: wled_context_effects
      domain: switch
  fields:
    config:
      name: Configuration
      description: Configuration dictionary with values to update
      required: true
      example: '{"brightness": 200, "speed": 50}'
      selector:
        object:

set_text:
  name: Set Text
  description: Update the text shown by a TextEffect or StateTextEffect
  target:
    entity:
      integration: wled_context_effects
      domain: switch
  fields:
    text:
      name: Text
      description: Text to display on the LED matrix
      required: true
      selector:
        text:
    scroll_speed:
      name: Scroll Speed
      description: Marquee speed 0–255
      required: false
      selector:
        number:
          min: 0
          max: 255
    direction:
      name: Direction
      description: Scroll direction
      required: false
      selector:
        select:
          options:
            - left
            - right
    font_size:
      name: Font Size
      description: Font size 1–4 (small to large)
      required: false
      selector:
        number:
          min: 1
          max: 4
    text_color:
      name: Text Color
      description: Foreground color as R,G,B
      required: false
      selector:
        text:
    bg_color:
      name: Background Color
      description: Background color as R,G,B
      required: false
      selector:
        text:

reload:
  name: Reload
  description: Reload effect modules (for development)
